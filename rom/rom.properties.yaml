# ---------------------------------------------------------------- ROM 自述（输入）
#
# 这个文件属于**运行时仓库**（guest-runtime-a15），不属于 app。
# 它保存 ROM 的「身份」：id / 名字 / 默认版本。改 ROM 定制的人在这里改。
#
# 打包器（rom/pack-rom.py）会把它扩展成 zip 根里的 versebox_properties.yaml
# （schema: versebox-rom/2），其中 apiLevel 来自准备的清单（prepare-a15.py 的产物），
# payloadBytes / payloadSha256 由打包器按实际内容算出来。
#
# 规范见 app 仓库的 docs/rom-package/02-ROM包结构与命名.md
schema: versebox-rom-properties/1
id: android15
name: Android 15
androidVersion: "15"
description: 独立 API 35 用户空间（Redroid 15 64bit-only + AOSP 15 自建运行时）
defaultRomVersion: 1.0.0

# 客体 .so 的承载方式：
#   apk  —— 客体 .so 仍由 APK 的 lib/arm64-v8a 提供，ROM 只带数据（旧行为）
#   rom  —— 客体 .so 下沉到 ROM 的 payload/lib（**默认**）
#   both —— 两边都有，运行时优先 ROM、缺了回落旧格式 payload（灰度用）
#
# 2026-11-11 起默认 rom：docs/rom-package/04 §3.2 的前置实验已在真机通过
# （3B15AV00JCP00000 / Android 15 / API 35 / SELinux Enforcing）：
#   run-as me.kanadex.versebox sh -c 'files/exec-probe/linker-probe; echo rc=$?'
#   -> 打印 linker 的 usage，rc=0（= filesDir 下的 ELF 可以 execve）
# 结论与判据写在 guest-runtime-a15/STATUS.md 的「/data 可执行性」一节。
libMode: rom
