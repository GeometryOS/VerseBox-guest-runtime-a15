# Publishes one release, from the artifacts of that tag's own build.
#
# A tag only starts a build (build.yml). This workflow is the separate publishing action: it
# takes the artifacts GitHub already produced for that tag, runs the gates below, generates the
# body from the repository, and attaches the files. Nothing is packed on a developer machine,
# and pushing a tag never creates a release on its own.
#
# Gates, in order:
#   1. the tag matches vX.Y.Z or vX.Y.Z-suffix and exists;
#   2. Build A15 runtime succeeded for that exact tag, not merely for the same commit;
#   3. every downloaded file matches SHA256SUMS, so the bytes are the bytes the build verified;
#   4. the ROM package passes rom/pack-rom.py --verify-only, which re-reads its own manifest;
#   5. the package's romKey matches rom/rom.properties.yaml, so the file carries the version
#      the repository claims.
#
# Title is <version>.<YYYYMMDD>. Body comes from .github/scripts/generate-release-notes.mjs.
# release/release.json keeps one entry per version, newest last, last 100 versions kept.
name: Release Publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish, shaped vX.Y.Z-a15-boot-YYYYMMDD'
        required: true
        type: string
      dry_run:
        description: 'Run the gates and print the notes without publishing anything'
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  group: a15-release-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout the tag with full history
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          fetch-tags: true

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 'Gate 1: the tag exists and matches vX.Y.Z'
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' \
            || { echo "tag $TAG is not vX.Y.Z or vX.Y.Z-suffix" >&2; exit 1; }
          git rev-parse --verify "refs/tags/$TAG" >/dev/null 2>&1 \
            || { echo "tag $TAG does not exist in this repository" >&2; exit 1; }
          echo "tag commit: $(git rev-list -n1 "refs/tags/$TAG")"

      # A green run on the same commit is not enough: a branch build and a tag build of one
      # commit differ in the tarball name, and the release has to carry the tag's own file.
      - name: 'Gate 2: a successful build for this tag'
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          sha=$(git rev-list -n1 "refs/tags/$TAG")
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/build.yml/runs?event=push&per_page=100" \
            > "$RUNNER_TEMP/runs.json"
          python3 - "$RUNNER_TEMP/runs.json" "$sha" "$TAG" "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          runs_path, sha, tag, out_path = sys.argv[1:5]
          pages = json.load(open(runs_path, encoding='utf-8'))
          runs = [run for page in pages for run in page.get('workflow_runs', [])]
          same = [run for run in runs if run.get('head_sha') == sha]
          for run in same:
              print('  run %s  conclusion=%s  head_branch=%s' % (run['id'], run['conclusion'], run['head_branch']))
          green = sorted((run for run in same
                          if run.get('conclusion') == 'success' and run.get('head_branch') == tag),
                         key=lambda run: run['id'], reverse=True)
          if not green:
              print('no successful Build A15 runtime run for tag %s at %s.' % (tag, sha), file=sys.stderr)
              print('Push the tag and wait for that build to pass before publishing.', file=sys.stderr)
              sys.exit(1)
          with open(out_path, 'a', encoding='utf-8') as handle:
              handle.write('run_id=%s\n' % green[0]['id'])
              handle.write('run_url=%s\n' % green[0]['html_url'])
              handle.write('commit=%s\n' % sha)
          print('using %s' % green[0]['html_url'])
          PY

      - name: Download the artifacts of that build
        uses: actions/download-artifact@v4
        with:
          name: a15-runtime
          path: .
          run-id: ${{ steps.build.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: 'Gate 3: every file matches SHA256SUMS'
        run: |
          set -euo pipefail
          shopt -s nullglob
          for pattern in 'a15-runtime-*.tar.gz' 'dist/versebox-*.zip' 'dist/*-min.zip' 'dist/pack-*.json' 'dist/apk-resident-libs-*.tar'; do
            files=($pattern)
            if [ ${#files[@]} -eq 0 ]; then
              echo "the tagged build has no $pattern" >&2
              exit 1
            fi
          done
          ls -l dist/
          sha256sum --check --strict SHA256SUMS

      # The package is verified from its own manifest, so a corrupted or hand-edited zip cannot
      # reach a release even if somebody regenerates SHA256SUMS around it.
      - name: 'Gate 4: the ROM package verifies'
        run: |
          set -euo pipefail
          shopt -s nullglob
          full=()
          for zip in dist/versebox-*.zip; do
            case "$zip" in
              *-min.zip) ;;
              *) full+=("$zip") ;;
            esac
          done
          if [ ${#full[@]} -ne 1 ]; then
            echo "expected exactly one full ROM package, found ${#full[@]}" >&2
            exit 1
          fi
          python3 rom/pack-rom.py --verify-only "${full[0]}"

      - name: Collect the assets
        run: |
          set -euo pipefail
          shopt -s nullglob
          node .github/scripts/collect-release-assets.mjs --out release-assets.json \
            a15-runtime-*.tar.gz dist/versebox-*.zip dist/*-min.zip \
            dist/apk-resident-libs-*.tar dist/pack-*.json SHA256SUMS
          cat release-assets.json

      - name: Generate the release notes
        id: notes
        env:
          TAG: ${{ inputs.tag }}
          RUN_URL: ${{ steps.build.outputs.run_url }}
          COMMIT: ${{ steps.build.outputs.commit }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          packs=(dist/pack-*.json)
          node .github/scripts/generate-release-notes.mjs \
            --tag "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --assets release-assets.json \
            --rom-properties rom/rom.properties.yaml \
            --pack-report "${packs[0]}" \
            --commit "$COMMIT" \
            --run-url "$RUN_URL" \
            --notes CHANGELOG.md \
            --title release-title.txt \
            --version-out release-version.txt
          echo "title=$(cat release-title.txt)" >> "$GITHUB_OUTPUT"

      - name: Record the version in the index
        run: |
          set -euo pipefail
          shopt -s nullglob
          packs=(dist/pack-*.json)
          node .github/scripts/update-release-index.mjs \
            --file release/release.json \
            --version "$(cat release-version.txt)" \
            --tag "${{ inputs.tag }}" \
            --title "$(cat release-title.txt)" \
            --rom-properties rom/rom.properties.yaml \
            --pack-report "${packs[0]}" \
            --commit "${{ steps.build.outputs.commit }}" \
            --run-url "${{ steps.build.outputs.run_url }}" \
            --assets release-assets.json
          cat release/release.json

      - name: 'Dry run: print the notes and stop'
        if: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          echo '--- title ---'
          cat release-title.txt
          echo '--- body ---'
          cat CHANGELOG.md

      - name: Publish the release
        if: ${{ !inputs.dry_run }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ steps.notes.outputs.title }}
          body_path: CHANGELOG.md
          files: |
            a15-runtime-*.tar.gz
            dist/versebox-*.zip
            dist/*-min.zip
            dist/apk-resident-libs-*.tar
            dist/pack-*.json
            SHA256SUMS
          fail_on_unmatched_files: true
          draft: false

      # The index is committed after the release exists, so a reader never finds a version whose
      # files are not published yet. Re-running this workflow repairs a half-finished publish,
      # because the upsert replaces the entry instead of appending a second one.
      - name: Commit the release index
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          gh auth setup-git
          branch=$(gh repo view "$GITHUB_REPOSITORY" --json defaultBranchRef -q .defaultBranchRef.name)
          work=$(mktemp -d)
          gh repo clone "$GITHUB_REPOSITORY" "$work/index" -- --depth=1 --branch "$branch"
          mkdir -p "$work/index/release"
          cp release/release.json "$work/index/release/release.json"
          cd "$work/index"
          if git diff --quiet -- release/release.json; then
            echo 'release index already records this version'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release/release.json
          git commit -m "chore(release): record ${TAG}"
          for attempt in 1 2 3; do
            if git push origin "HEAD:$branch"; then
              echo "release index pushed to $branch"
              exit 0
            fi
            git fetch origin "$branch"
            git rebase "origin/$branch" || { echo 'index rebase conflict, resolve by hand' >&2; exit 1; }
          done
          echo 'could not push the release index after three attempts' >&2
          exit 1
