# Full build of the Android 15 runtime payload (prepared/) **and the new-format ROM package** for CI and releases.
#
# This repository only handles the A15 guest runtime: image -> rootfs/APEX -> API 35 runtime ->
# bridges/graphics -> prepared (assets + jniLibs + manifest) -> dist/versebox-android15-<ver>.zip.
# The two product chains meet here but are independent: ROM only reads prepared; APK belongs to the host project,
# not built in this repo (no app source in the runner, scripts/build.sh will stop at the ROM package automatically).
#
# Artifacts for commits/PRs: a15-runtime-<ref>.tar.gz (prepared) + versebox-*.zip (ROM package) + SHA256SUMS.
#
# Triggers:
#   * push any branch / PR -> Full build (incremental after cache)
#   * push tag v*          -> Build and create GitHub Release
#   * workflow_dispatch    -> Manual build (optionally rebuild desktop-gpu-host from source)
name: Build A15 runtime

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      rebuild_desktop:
        description: "Rebuild desktop-gpu-host from source (defaults to pinned version)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: a15-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/29.0.14206865
      A15_SKIP_APK: "1"
      A15_REBUILD_DESKTOP: ${{ github.event.inputs.rebuild_desktop == 'true' && '1' || '0' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Use sdkmanager from the runner's pre-installed Android SDK directly.
      # Do not use android-actions/setup-android: it internally runs sdkmanager "tools",
      # which is no longer available in newer cmdline-tools and will make the whole job fail during installation.
      - name: Install platform / build-tools / NDK 29
        run: |
          set -e
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "${SDKMANAGER}" ]; then SDKMANAGER=$(command -v sdkmanager || true); fi
          if [ -z "${SDKMANAGER}" ] || [ ! -x "${SDKMANAGER}" ]; then
            echo "no sdkmanager in $ANDROID_HOME/cmdline-tools/latest or PATH" >&2
            ls "$ANDROID_HOME" >&2 || true
            exit 1
          fi
          echo "sdkmanager: ${SDKMANAGER}"
          echo "${ANDROID_HOME}/cmdline-tools/latest/bin" >> "${GITHUB_PATH}"
          echo "${ANDROID_HOME}/platform-tools" >> "${GITHUB_PATH}"
          yes | "${SDKMANAGER}" --sdk_root="${ANDROID_HOME}" --licenses >/dev/null || true
          "${SDKMANAGER}" --sdk_root="${ANDROID_HOME}" --install \
            "platforms;android-35" "build-tools;35.0.0" "ndk;29.0.14206865"
          test -x "${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++"
          test -x "${ANDROID_HOME}/build-tools/35.0.0/d8"
          test -x "${ANDROID_HOME}/build-tools/35.0.0/aidl"

      - name: Install patchelf
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends patchelf

      # Three layers of cache, each key only covers inputs affecting that layer:
      #   image tar      <- fetch scripts
      #   rootfs         <- extract scripts (changing APEX parsing won't re-download the 700 MB image)
      #   native outputs <- runtime/bridges/graphics sources and scripts
      - name: Cache image tarball
        uses: actions/cache@v4
        with:
          path: downloads
          key: a15-image-${{ runner.os }}-${{ hashFiles('scripts/fetch-redroid15.py') }}

      - name: Cache extracted rootfs
        uses: actions/cache@v4
        with:
          path: rootfs
          key: a15-rootfs-${{ runner.os }}-${{ hashFiles('scripts/extract-rootfs.py', 'scripts/extract-apex.py') }}

      - name: Cache AOSP sources and native outputs
        uses: actions/cache@v4
        with:
          path: |
            runtime/upstream
            runtime/build
            bridges/lib
            bridges/bin
            bridges/obj
            bridges/graphics
          key: a15-native-${{ runner.os }}-${{ hashFiles('runtime/*.sh', 'runtime/*.py', 'runtime/fetch-a15-sources.sh', 'bridges/**', 'vendor/native/**', 'third_party/graphics/**', 'vendor/graphics/sources.txt') }}

      # Default order of sh scripts/build.sh: image -> rootfs -> APEX -> runtime -> bridges
      # -> prepared -> **ROM package (dist/)** -> (build APK only if app project exists).
      # Here A15_SKIP_APK=1, and there is no app project in the runner, so it will definitely stop after the ROM package.
      - name: Build (image -> rootfs -> APEX -> runtime -> bridges -> prepared -> ROM)
        run: sh scripts/build.sh

      - name: Verify prepared manifest
        run: |
          python3 - <<'PY'
          import json, pathlib
          manifest = pathlib.Path("prepared/assets/guest-runtime-a15-inputs.json")
          assert manifest.is_file(), "missing " + str(manifest)
          m = json.loads(manifest.read_text(encoding="utf-8"))
          assert m["guestSdk"] == 35 and m["frameworkSdk"] == 35, "wrong SDK in manifest"
          files = m["files"]
          assert len(files) > 1000, "too few native files: %d" % len(files)
          for entry in files:
              path = pathlib.Path("prepared/jniLibs/arm64-v8a") / entry["name"]
              assert path.is_file(), "missing " + str(path)
              assert path.stat().st_size == entry["bytes"], "size mismatch: " + str(path)
          print("prepared ok: %d native, %d data" % (len(files), len(m["data"])))
          PY

      # Run the ROM package self-check again: do not use "the packing script said success" as proof (docs/rom-package/05 §6).
      - name: Verify ROM package
        run: |
          set -e
          ls -l dist/
          shopt -s nullglob
          zips=(dist/versebox-*.zip)
          if [ ${#zips[@]} -eq 0 ]; then
            echo "no ROM package produced under dist/ (pack-rom step did not run?)" >&2
            exit 1
          fi
          for zip in "${zips[@]}"; do
            python3 rom/pack-rom.py --verify-only "$zip"
          done

      - name: Gradle AAR (only when the Gradle shell exists)
        if: hashFiles('settings.gradle.kts') != '' && hashFiles('gradlew') != ''
        run: ./gradlew --no-daemon assembleDebug

      - name: Package
        run: |
          set -e
          name="a15-runtime-${GITHUB_REF_NAME:-dev}"
          tar -czf "${name}.tar.gz" prepared
          sha256sum "${name}.tar.gz" > SHA256SUMS
          # Put the ROM package and its packing report into the artifact: the report contains payloadSha256 / entry count,
          # so you don't need to rerun the packer to trace "how this package was created".
          shopt -s nullglob
          for f in dist/versebox-*.zip dist/pack-*.json; do
            [ -f "$f" ] || continue
            sha256sum "$f" >> SHA256SUMS
          done
          cat SHA256SUMS

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: a15-runtime
          path: |
            a15-runtime-*.tar.gz
            dist/versebox-*.zip
            dist/pack-*.json
            SHA256SUMS
          if-no-files-found: error

      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            a15-runtime-*.tar.gz
            dist/versebox-*.zip
            dist/pack-*.json
            SHA256SUMS